# Machine-readable data catalog. This file is the source of truth.
# docs/03_data_catalog.md is generated from it:
#   python -m careplatform.governance.render_catalog
# tests/test_governance_config.py fails if any table is missing required fields.

allowed_classifications: [Public, Internal, Confidential]
allowed_layers: [bronze, silver, gold, ops]

domains:
  regulations:     {data_owner: Regulations Data Owner,  data_steward: Regulations Data Steward}
  ai_operations:   {data_owner: AI Operations Owner,     data_steward: AI Operations Steward}
  evaluation:      {data_owner: Evaluation Owner,        data_steward: Evaluator}
  platform:        {data_owner: Platform Owner,          data_steward: Data Engineer}

tables:

  # ---------------- BRONZE ----------------
  - name: bronze.raw_documents
    layer: bronze
    domain: regulations
    description: File register. One row per unique source file pulled by any connector (BC Laws API, GitHub API). Raw bytes stay in data/landing.
    classification: Public
    retention_days: 1825
    grain: one row per unique file (by content hash)
    primary_key: [doc_id]
    write_mode: append
    columns:
      - {name: doc_id,          type: string,    nullable: false, description: SHA-256 of file bytes. Same content is never loaded twice.}
      - {name: source_id,       type: string,    nullable: false, description: Key into config/sources.yaml}
      - {name: source_system,   type: string,    nullable: false, description: Connector that fetched it (bclaws | github)}
      - {name: file_name,       type: string,    nullable: false, description: File name}
      - {name: source_ref,      type: string,    nullable: false, description: Where it lives in the source. Document id for BC Laws, repo path for GitHub.}
      - {name: source_version,  type: string,    nullable: true,  description: Version marker from the source. ETag or Last-Modified for BC Laws, commit SHA for GitHub.}
      - {name: remote_hash,     type: string,    nullable: true,  description: Hash the source gives before download (Git blob SHA). Null when the API has none.}
      - {name: landing_path,    type: string,    nullable: false, description: Path under the landing root where the bytes were saved (data/landing locally, the bronze.landing volume on Databricks)}
      - {name: source_url,      type: string,    nullable: false, description: Link a person can open to see exactly what was loaded}
      - {name: doc_type,        type: string,    nullable: false, description: act | regulation | inspection_report}
      - {name: jurisdiction,    type: string,    nullable: false, description: ON or BC}
      - {name: mime_type,       type: string,    nullable: false, description: Guessed from the file extension}
      - {name: file_size_bytes, type: long,      nullable: false, description: Size in bytes}
      - {name: ingested_at,     type: timestamp, nullable: false, description: UTC time the row was written}
      - {name: load_id,         type: string,    nullable: false, description: run_id from ops.run_log that loaded this file}

    # ---------------- SILVER ----------------
  # Silver turns raw files into clean, citable units of law (ADR-009).
  # BC Laws XML gives sections; PDFs (Ontario, later) give pages. One table holds both.
  - name: silver.document_units
    layer: silver
    domain: regulations
    description: One row per version of a section (XML) or page (PDF). History is kept (SCD2), so amended and repealed text is never lost. Only is_current rows feed chunks.
    classification: Public
    retention_days: 1825
    grain: one row per unit per version of its text
    primary_key: [unit_id]
    write_mode: merge
    columns:
      - {name: unit_id,           type: string,    nullable: false, description: "SHA-256 of source_id + unit_ref + text_hash. Same text, same id."}
      - {name: source_id,         type: string,    nullable: false, description: Key into config/sources.yaml. Stable across versions of the law.}
      - {name: doc_id,            type: string,    nullable: false, description: FK to bronze.raw_documents. The document version this text first appeared in.}
      - {name: unit_type,         type: string,    nullable: false, description: section | page}
      - {name: unit_ref,          type: string,    nullable: false, description: "Citation-ready reference, unique within a source. e.g. s. 12, Sch. 2, s. 1, p. 7"}
      - {name: unit_order,        type: int,       nullable: false, description: Position in the document, from the file order (section numbers can be ranges like 30-31)}
      - {name: context_path,      type: string,    nullable: true,  description: "Where the unit sits, e.g. Part 4 Care and Supervision > Division 2 Staffing"}
      - {name: heading,           type: string,    nullable: true,  description: Section heading (marginal note). Null for schedule sections and pages.}
      - {name: text,              type: string,    nullable: true,  description: Clean text with subsection numbers inline. Repealed subsections removed. Tables rendered row by row.}
      - {name: char_count,        type: int,       nullable: false, description: Length of text}
      - {name: token_estimate,    type: int,       nullable: false, description: "char_count / settings chunking.chars_per_token. An estimate, not a model count (ADR-009)."}
      - {name: text_hash,         type: string,    nullable: false, description: SHA-256 of text. How a changed section is detected between versions.}
      - {name: history_note,      type: string,    nullable: true,  description: Enactment and amendment notes from the source, including notes of repealed subsections}
      - {name: is_repealed,       type: boolean,   nullable: false, description: True when the whole unit is repealed. Kept for the record, never chunked.}
      - {name: in_force,          type: boolean,   nullable: false, description: "False when the unit is marked Not in force (enacted but not in effect). Kept for the record, never chunked."}
      - {name: extraction_method, type: string,    nullable: false, description: xml | pypdf}
      - {name: valid_from,        type: timestamp, nullable: false, description: "UTC time the platform first saw this text. System time, NOT the legal effective date (ADR-009)."}
      - {name: valid_to,          type: timestamp, nullable: true,  description: UTC time it was replaced. Null while current.}
      - {name: is_current,        type: boolean,   nullable: false, description: True for the version in force now. One per source_id + unit_ref.}
      - {name: load_id,           type: string,    nullable: false, description: run_id that wrote this version}


  - name: silver.chunks
    layer: silver
    domain: regulations
    description: Retrieval chunks built from current, non-repealed units. Usually one per section; long sections are split at subsection boundaries. Rows are never deleted; replaced chunks are retired (is_active false), so gold knows exactly what to add and what to remove.
    classification: Public
    retention_days: 365
    grain: one row per chunk (active or retired)
    primary_key: [chunk_id]
    write_mode: merge
    columns:
      - {name: chunk_id,        type: string,    nullable: false, description: "SHA-256 of unit_id + chunk_index + chunker_version. Stable while the text and the chunking logic are unchanged, so gold is not rebuilt for nothing."}
      - {name: unit_id,         type: string,    nullable: false, description: FK to silver.document_units}
      - {name: doc_id,          type: string,    nullable: false, description: FK to bronze.raw_documents}
      - {name: source_id,       type: string,    nullable: false, description: Key into config/sources.yaml}
      - {name: unit_ref,        type: string,    nullable: false, description: "Citation shown with answers, e.g. s. 43"}
      - {name: chunk_index,     type: int,       nullable: false, description: 0 for a whole unit; 0, 1, 2 when a long unit is split}
      - {name: context_header,  type: string,    nullable: false, description: "Label put in front of the text, e.g. [BC | Residential Care Regulation | Part 4 > Division 2 | s. 43 Fire drills]"}
      - {name: text,            type: string,    nullable: false, description: context_header + chunk text. This is what gets embedded and sent to the LLM.}
      - {name: token_estimate,  type: int,       nullable: false, description: Estimated tokens of text (header included)}
      - {name: text_hash,       type: string,    nullable: false, description: SHA-256 of normalized text, for duplicate checks}
      - {name: pii_flag,        type: boolean,   nullable: false, description: True if PII scan found something. Excluded from gold.}
      - {name: chunker_version, type: string,    nullable: false, description: Version of the chunking logic that built it (settings chunking.chunker_version). Bumping it rebuilds every chunk.}
      - {name: is_active,       type: boolean,   nullable: false, description: True while the chunk reflects current, live law. Gold embeds active chunks and removes retired ones.}
      - {name: retired_at,      type: timestamp, nullable: true,  description: UTC time it stopped being active (text amended, unit repealed or removed, or chunker_version bumped)}
      - {name: load_id,         type: string,    nullable: false, description: run_id that created the chunk. Unchanged chunks keep their original load_id.}


  - name: silver.cross_references
    layer: silver
    domain: regulations
    description: Links from a unit to another law, read from the source markup (no LLM). Feeds REFERENCES edges in the knowledge graph.
    classification: Public
    retention_days: 1825
    grain: one row per link per unit version
    primary_key: [ref_id]
    write_mode: merge
    columns:
      - {name: ref_id,        type: string, nullable: false, description: "SHA-256 of unit_id + position of the link in the unit"}
      - {name: unit_id,       type: string, nullable: false, description: FK to silver.document_units (the unit containing the link)}
      - {name: source_id,     type: string, nullable: false, description: Law the link is in}
      - {name: unit_ref,      type: string, nullable: false, description: Unit the link is in}
      - {name: target_href,   type: string, nullable: false, description: "Link target as published, e.g. /legislation/96405_01"}
      - {name: target_doc_id, type: string, nullable: true,  description: "BC document id parsed from the href, e.g. 96405_01. Null if the link is not to legislation."}
      - {name: target_text,   type: string, nullable: false, description: "Link text, e.g. Representation Agreement Act"}
      - {name: load_id,       type: string, nullable: false, description: run_id that produced the row}

  # ---------------- GOLD ----------------
  - name: gold.chunk_embeddings
    layer: gold
    domain: regulations
    description: One vector per active, non-PII chunk per embedding model. Follows the chunk lifecycle, so amended or repealed law can't be found through the vector index. Only new chunks are embedded (ADR-010).
    classification: Public
    retention_days: 365
    grain: one row per chunk per embedding model (active or retired)
    primary_key: [chunk_id, embedding_model]
    write_mode: merge
    columns:
      - {name: chunk_id,        type: string,       nullable: false, description: FK to silver.chunks}
      - {name: embedding_model, type: string,       nullable: false, description: "Model endpoint that produced the vector, e.g. databricks-gte-large-en. Vectors from different models are never compared."}
      - {name: embedding_dim,   type: int,          nullable: false, description: Vector length. Must equal models.embeddings.dim (DQ-G-002).}
      - {name: vector,          type: array<float>, nullable: false, description: The embedding}
      - {name: is_active,       type: boolean,      nullable: false, description: True while its chunk is active. Search only uses active vectors.}
      - {name: retired_at,      type: timestamp,    nullable: true,  description: UTC time its chunk was retired (amended, repealed, rebuilt) or flagged for PII}
      - {name: load_id,         type: string,       nullable: false, description: run_id that created the vector}

  - name: gold.entities
    layer: gold
    domain: regulations
    description: Entities extracted from chunks by the LLM using a fixed schema.
    classification: Public
    retention_days: 365
    grain: one row per entity mention per chunk
    primary_key: [entity_id, source_chunk_id]
    write_mode: merge
    columns:
      - {name: entity_id,       type: string, nullable: false, description: Hash of entity_type + normalized_name}
      - {name: entity_type,     type: string, nullable: false, description: Must be in the allowed entity schema}
      - {name: name,            type: string, nullable: false, description: As written in the text}
      - {name: normalized_name, type: string, nullable: false, description: Lower case, trimmed, used for matching}
      - {name: source_chunk_id, type: string, nullable: false, description: FK to silver.chunks. Record-level lineage.}
      - {name: extraction_model,type: string, nullable: false, description: Model deployment used}
      - {name: prompt_version,  type: string, nullable: false, description: Version of the extraction prompt}
      - {name: load_id,         type: string, nullable: false, description: run_id that produced the row}

  - name: gold.relationships
    layer: gold
    domain: regulations
    description: Relationships between entities extracted from chunks.
    classification: Public
    retention_days: 365
    grain: one row per relationship mention per chunk
    primary_key: [rel_id]
    write_mode: merge
    columns:
      - {name: rel_id,          type: string, nullable: false, description: Hash of src + type + dst + chunk}
      - {name: src_entity_id,   type: string, nullable: false, description: FK to gold.entities}
      - {name: rel_type,        type: string, nullable: false, description: Must be in the allowed relationship schema}
      - {name: dst_entity_id,   type: string, nullable: false, description: FK to gold.entities}
      - {name: source_chunk_id, type: string, nullable: false, description: FK to silver.chunks}
      - {name: prompt_version,  type: string, nullable: false, description: Version of the extraction prompt}
      - {name: load_id,         type: string, nullable: false, description: run_id that produced the row}

  - name: gold.llm_call_log
    layer: gold
    domain: ai_operations
    description: One row per model attempt through the LLM gateway (ADR-011). Metrics only; never the prompt, the answer or a key (ADR-004).
    classification: Internal
    retention_days: 180
    grain: one row per model attempt (a fallback adds a second row for the same request)
    primary_key: [call_id]
    write_mode: append
    columns:
      - {name: call_id,             type: string,    nullable: false, description: UUID}
      - {name: called_at,           type: timestamp, nullable: false, description: UTC}
      - {name: run_id,              type: string,    nullable: false, description: Pipeline run or app session that made the call}
      - {name: purpose,             type: string,    nullable: false, description: "rag | judge | extraction | smoke"}
      - {name: provider,            type: string,    nullable: false, description: "databricks | gemini"}
      - {name: model,               type: string,    nullable: false, description: Model or endpoint name from settings.yaml models.chat}
      - {name: prompt_version,      type: string,    nullable: false, description: Versioned prompt used (config/prompts), so every answer traces to its exact instructions}
      - {name: data_classification, type: string,    nullable: false, description: Classification of the data sent (docs/02). Decides which models were allowed}
      - {name: prompt_tokens,       type: int,       nullable: true,  description: From the API response}
      - {name: completion_tokens,   type: int,       nullable: true,  description: From the API response, including reasoning tokens}
      - {name: latency_ms,          type: int,       nullable: false, description: Wall clock time for this model, retries included}
      - {name: status,              type: string,    nullable: false, description: "ok | error"}
      - {name: error_type,          type: string,    nullable: true,  description: Error class when status is error}
      - {name: retry_count,         type: int,       nullable: false, description: Retries before this result}
      - {name: fallback_used,       type: boolean,   nullable: false, description: True if this model was not the first one tried}
      - {name: cost_usd,            type: double,    nullable: false, description: Tokens times settings.yaml pricing}
      - {name: request_hash,        type: string,    nullable: false, description: SHA-256 of the messages. Spots repeats without storing text}
  
  
  - name: gold.eval_questions
    layer: gold
    domain: evaluation
    description: Hand-written gold question set with expected answers and sources.
    classification: Internal
    retention_days: 1825
    grain: one row per question per version
    primary_key: [question_id, version]
    write_mode: append
    columns:
      - {name: question_id,      type: string,        nullable: false, description: Stable ID like Q-001}
      - {name: version,          type: int,           nullable: false, description: Bumped when the question or answer changes}
      - {name: question,         type: string,        nullable: false, description: The question}
      - {name: expected_answer,  type: string,        nullable: false, description: Reference answer}
      - {name: expected_sources, type: array<string>, nullable: false, description: doc_id and section refs that support the answer}
      - {name: category,         type: string,        nullable: false, description: lookup | relationship | multi_hop | negative}
      - {name: author,           type: string,        nullable: false, description: Who wrote it}
      - {name: created_at,       type: timestamp,     nullable: false, description: UTC}

  - name: gold.eval_results
    layer: gold
    domain: evaluation
    description: Judge scores and human labels per question per pipeline run.
    classification: Internal
    retention_days: 1825
    grain: one row per question per eval run per pipeline variant
    primary_key: [eval_run_id, question_id, variant]
    write_mode: append
    columns:
      - {name: eval_run_id,          type: string,        nullable: false, description: FK to ops.run_log}
      - {name: question_id,          type: string,        nullable: false, description: FK to gold.eval_questions}
      - {name: variant,              type: string,        nullable: false, description: vector | graph | hybrid}
      - {name: answer,               type: string,        nullable: false, description: What the app answered}
      - {name: retrieved_chunk_ids,  type: array<string>, nullable: false, description: What the retriever returned}
      - {name: judge_score,          type: int,           nullable: true,  description: 1 to 5 from the judge}
      - {name: judge_model,          type: string,        nullable: true,  description: Model used as judge}
      - {name: judge_prompt_version, type: string,        nullable: true,  description: Version of the judge prompt}
      - {name: human_label,          type: int,           nullable: true,  description: 1 to 5 from a person, for calibration}
      - {name: latency_ms,           type: int,           nullable: false, description: End to end answer time}
      - {name: cost_usd,             type: double,        nullable: false, description: Total cost for this answer}

  # ---------------- OPS ----------------
  - name: ops.run_log
    layer: ops
    domain: platform
    description: One row per pipeline run. Ties every table back to the code and config that built it.
    classification: Internal
    retention_days: 1825
    grain: one row per run
    primary_key: [run_id]
    write_mode: append
    columns:
      - {name: run_id,        type: string,    nullable: false, description: UUID. Written into load_id on every row the run touches.}
      - {name: pipeline,      type: string,    nullable: false, description: e.g. bronze_ingest, silver_chunk}
      - {name: started_at,    type: timestamp, nullable: false, description: UTC}
      - {name: ended_at,      type: timestamp, nullable: true,  description: UTC, null while running}
      - {name: status,        type: string,    nullable: false, description: RUNNING | SUCCEEDED | FAILED}
      - {name: rows_in,       type: long,      nullable: true,  description: Rows read}
      - {name: rows_out,      type: long,      nullable: true,  description: Rows written}
      - {name: git_commit,    type: string,    nullable: true,  description: Short commit hash of the code that ran}
      - {name: config_hash,   type: string,    nullable: false, description: Hash of the config files at run time}
      - {name: error_message, type: string,    nullable: true,  description: Set when status is FAILED}

  - name: ops.dq_results
    layer: ops
    domain: platform
    description: One row per DQ rule evaluated per run.
    classification: Internal
    retention_days: 1825
    grain: one row per rule per run
    primary_key: [run_id, rule_id]
    write_mode: append
    columns:
      - {name: run_id,         type: string,    nullable: false, description: FK to ops.run_log}
      - {name: rule_id,        type: string,    nullable: false, description: FK to config/dq_rules.yaml}
      - {name: table_name,     type: string,    nullable: false, description: Table checked}
      - {name: dimension,      type: string,    nullable: false, description: completeness | validity | uniqueness | consistency | timeliness | accuracy}
      - {name: severity,       type: string,    nullable: false, description: critical | warning}
      - {name: status,         type: string,    nullable: false, description: pass | fail}
      - {name: observed_value, type: double,    nullable: true,  description: What the check measured}
      - {name: threshold,      type: double,    nullable: true,  description: What it was compared to}
      - {name: failed_rows,    type: long,      nullable: true,  description: Rows that broke the rule}
      - {name: checked_at,     type: timestamp, nullable: false, description: UTC}

  - name: ops.api_call_log
    layer: ops
    domain: platform
    description: One row per HTTP attempt made by any connector, including retries. Auth headers are never logged.
    classification: Internal
    retention_days: 180
    grain: one row per HTTP attempt
    primary_key: [call_id]
    write_mode: append
    columns:
      - {name: call_id,              type: string,    nullable: false, description: UUID}
      - {name: run_id,               type: string,    nullable: false, description: FK to ops.run_log}
      - {name: connector,            type: string,    nullable: false, description: e.g. github}
      - {name: method,               type: string,    nullable: false, description: HTTP method}
      - {name: endpoint,             type: string,    nullable: false, description: Path without host or query string}
      - {name: status_code,          type: int,       nullable: true,  description: HTTP status, null if the connection failed}
      - {name: attempt,              type: int,       nullable: false, description: 1 for the first try, 2+ for retries}
      - {name: latency_ms,           type: int,       nullable: false, description: Time for this attempt}
      - {name: response_bytes,       type: long,      nullable: true,  description: Size of the response body}
      - {name: rate_limit_remaining, type: int,       nullable: true,  description: Requests left in the current rate limit window}
      - {name: error_type,           type: string,    nullable: true,  description: Exception name or HTTPnnn when the attempt failed}
      - {name: called_at,            type: timestamp, nullable: false, description: UTC}

  - name: ops.watermarks
    layer: ops
    domain: platform
    description: High-water mark per source for incremental loads. Only moved after a successful, DQ-passed load.
    classification: Internal
    retention_days: 1825
    grain: one row per source system and scope
    primary_key: [source_system, scope]
    write_mode: merge
    columns:
      - {name: source_system,   type: string,    nullable: false, description: e.g. github}
      - {name: scope,           type: string,    nullable: false, description: What the mark covers. owner/repo@branch for GitHub, document id for BC Laws.}
      - {name: watermark_value, type: string,    nullable: false, description: Last loaded position. Commit SHA for GitHub, ETag and Last-Modified JSON for a BC Laws document.}
      - {name: updated_at,      type: timestamp, nullable: false, description: UTC}
      - {name: load_id,         type: string,    nullable: false, description: run_id that moved the mark}
