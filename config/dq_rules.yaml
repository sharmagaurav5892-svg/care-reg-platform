# Data quality rules. The DQ engine (src/careplatform/dq) reads this file.
# severity:
#   critical -> the load fails and nothing is promoted
#   warning  -> logged to ops.dq_results, load continues
# check types the engine supports:
#   not_null, unique, min_value, max_value, allowed_values,
#   row_count_min, ratio_min, ratio_max, foreign_key, custom

allowed_severities: [critical, warning]
allowed_dimensions: [completeness, validity, uniqueness, consistency, timeliness, accuracy]

rules:

  # ---------------- BRONZE ----------------
  - id: DQ-B-001
    table: bronze.raw_documents
    dimension: uniqueness
    severity: critical
    check: unique
    column: doc_id
    description: The same file (by content hash) must never be registered twice.

  - id: DQ-B-002
    table: bronze.raw_documents
    dimension: validity
    severity: critical
    check: min_value
    column: file_size_bytes
    threshold: 1
    description: Empty files are rejected.

  - id: DQ-B-003
    table: bronze.raw_documents
    dimension: validity
    severity: critical
    check: allowed_values
    column: doc_type
    values: [act, regulation, inspection_report]
    description: Every file must map to a known document type.

  - id: DQ-B-004
    table: bronze.raw_documents
    dimension: consistency
    severity: critical
    check: custom
    column: source_id
    description: Every source_id must exist in config/sources.yaml and be approved.

  - id: DQ-B-005
    table: bronze.raw_documents
    dimension: accuracy
    severity: critical
    check: custom
    column: landing_path
    description: The landing file must exist and still hash to its doc_id. Bronze promises we can rebuild from these files.

  - id: DQ-B-006
    table: bronze.raw_documents
    dimension: completeness
    severity: critical
    check: not_null
    column: source_ref
    description: Every file must record where it lives in the source system, or we lose lineage back to it.

  - id: DQ-B-007
    table: bronze.raw_documents
    dimension: validity
    severity: critical
    check: allowed_values
    column: jurisdiction
    values: ["ON", "BC"]
    description: Only the two provinces in scope. Also catches the YAML ON-becomes-true trap at the data level.

  - id: DQ-B-008
    table: bronze.raw_documents
    dimension: validity
    severity: critical
    check: allowed_values
    column: source_system
    values: [bclaws, github]
    description: Every row must come from a known connector.

      # ---------------- SILVER ----------------
  # silver.chunks rules are checked on ACTIVE chunks only; retired chunks are history.

  - id: DQ-S-001
    table: silver.document_units
    dimension: completeness
    severity: critical
    check: ratio_min
    expression: is_repealed OR char_count > 0
    threshold: 1.0
    description: Every unit that is still law must have text. An empty one means the parser missed the markup, and that law would silently vanish from answers.

  - id: DQ-S-002
    table: silver.chunks
    dimension: completeness
    severity: critical
    check: not_null
    column: text
    description: No empty chunks.

  - id: DQ-S-003
    table: silver.chunks
    dimension: validity
    severity: warning
    check: ratio_min
    expression: token_estimate BETWEEN 20 AND 1200
    threshold: 0.98
    description: Chunks should fall in the size band. Lower bound is 20, not 50, because short sections are valid law (25 of 279 BC sections are under 50 tokens, profiled 2026-09-26); the context header alone is about 20, so below that means a parsing fault.

  - id: DQ-S-004
    table: silver.chunks
    dimension: consistency
    severity: critical
    check: foreign_key
    column: doc_id
    references: bronze.raw_documents.doc_id
    description: Every chunk must trace back to a registered file.

  - id: DQ-S-005
    table: silver.chunks
    dimension: uniqueness
    severity: warning
    check: custom
    column: text_hash
    threshold: 0.05
    description: Duplicate chunk text above 5 percent points to repeated headers or a chunking bug.

  - id: DQ-S-006
    table: silver.chunks
    dimension: validity
    severity: warning
    check: ratio_max
    expression: pii_flag = true
    threshold: 0.01
    description: PII flags above 1 percent of chunks need Data Steward review. Flagged chunks never reach gold.

  - id: DQ-S-007
    table: silver.document_units
    dimension: uniqueness
    severity: critical
    check: custom
    column: is_current
    description: Exactly one current version per source_id + unit_ref. Two current versions means answers could quote amended law.

  - id: DQ-S-008
    table: silver.chunks
    dimension: consistency
    severity: critical
    check: custom
    column: unit_id
    description: Every chunk must come from a unit that is current, not repealed and in force. This is the rule that stops the app quoting old, cancelled or not-yet-effective law.

  - id: DQ-S-009
    table: silver.cross_references
    dimension: consistency
    severity: critical
    check: foreign_key
    column: unit_id
    references: silver.document_units.unit_id
    description: Every cross reference must belong to a unit we hold.

  - id: DQ-S-010
    table: silver.chunks
    dimension: consistency
    severity: critical
    check: custom
    column: chunker_version
    description: Every active chunk must be built by the current chunking logic. A mix means a rebuild stopped halfway and search would return two styles of the same law.

  # ---------------- GOLD ----------------
  - id: DQ-G-001
    table: gold.chunk_embeddings
    dimension: completeness
    severity: critical
    check: custom
    column: chunk_id
    threshold: 1.0
    description: Every active, non-PII chunk must have an active embedding. A missing one is law the search can never find, with no error anywhere.

  - id: DQ-G-002
    table: gold.chunk_embeddings
    dimension: validity
    severity: critical
    check: custom
    column: embedding_dim
    description: Vector length must match the configured embedding model. A different length means vectors from two models got mixed.

  - id: DQ-G-003
    table: gold.entities
    dimension: validity
    severity: critical
    check: allowed_values
    column: entity_type
    values: [Regulation, Section, Requirement, HomeType, CareService, Role, Penalty, Authority]
    description: The LLM must stay inside the entity schema. Anything else is a prompt problem.

  - id: DQ-G-004
    table: gold.relationships
    dimension: consistency
    severity: critical
    check: foreign_key
    column: src_entity_id
    references: gold.entities.entity_id
    description: No relationships pointing at entities that do not exist.

  - id: DQ-G-005
    table: gold.relationships
    dimension: validity
    severity: critical
    check: allowed_values
    column: rel_type
    values: [CONTAINS, REQUIRES, APPLIES_TO, REFERENCES, ENFORCED_BY, PENALIZED_BY, RESPONSIBLE_FOR]
    description: Relationship types must stay inside the graph schema.

  - id: DQ-G-006
    table: gold.llm_call_log
    dimension: validity
    severity: warning
    check: min_value
    column: cost_usd
    threshold: 0
    description: Negative cost means a pricing config error.

  - id: DQ-G-007
    table: gold.eval_questions
    dimension: completeness
    severity: critical
    check: custom
    column: expected_sources
    description: Every gold question must list at least one supporting source.

  - id: DQ-G-008
    table: gold.eval_results
    dimension: validity
    severity: critical
    check: allowed_values
    column: judge_score
    values: [1, 2, 3, 4, 5, null]
    description: Judge scores must be on the 1 to 5 scale. Anything else means the judge output was not parsed.

  - id: DQ-G-009
    table: gold.eval_results
    dimension: consistency
    severity: critical
    check: foreign_key
    column: question_id
    references: gold.eval_questions.question_id
    description: Every result must belong to a known gold question.

  - id: DQ-G-010
    table: gold.chunk_embeddings
    dimension: consistency
    severity: critical
    check: custom
    column: chunk_id
    description: No active embedding may belong to a chunk that is retired or flagged for PII. Otherwise search could return amended, repealed or personal text.

  - id: DQ-G-011
    table: gold.llm_call_log
    dimension: validity
    severity: critical
    check: custom
    column: data_classification
    description: Every call must have gone to a model allowed for that data's classification, and restricted data to none. A breach means data left the platform against policy.
  # ---------------- OPS ----------------
  - id: DQ-O-002
    table: ops.dq_results
    dimension: consistency
    severity: critical
    check: custom
    column: rule_id
    description: Every rule_id logged must exist in config/dq_rules.yaml. Catches renamed or deleted rules.

  - id: DQ-O-001
    table: ops.run_log
    dimension: timeliness
    severity: warning
    check: custom
    column: status
    description: No run should sit in RUNNING for more than 2 hours. Stuck runs get flagged.

  - id: DQ-O-003
    table: ops.api_call_log
    dimension: validity
    severity: warning
    check: ratio_max
    expression: status_code IS NULL OR status_code >= 500
    threshold: 0.10
    description: More than 10 percent failed calls means the source API is struggling. Retries hide it, this surfaces it.

  - id: DQ-O-004
    table: ops.watermarks
    dimension: completeness
    severity: critical
    check: not_null
    column: watermark_value
    description: A blank watermark would make the next run reload everything or skip everything.
