# Non-secret settings. Secrets go in .env (see .env.example), never here.

project:
  name: care-reg-platform
  env: dev                      # dev | prod

lakehouse:
  mode: local                   # local | databricks | fabric (jobs override with --mode)
  databricks_catalog: care_reg_dev   # jobs override with --catalog (care_reg_prod in prod)
  local_root: ./data/lakehouse
  landing_root: ./data/landing
  fabric_root: null             # set to the OneLake abfss:// Tables path in fabric mode

ingestion:
  enabled_connectors: [bclaws, github]   # each runs as its own pipeline run
  bclaws:
    base_url: https://www.bclaws.gov.bc.ca
    document_path: /civix/document/id/complete/statreg/{document_id}
    user_agent: care-reg-platform/0.2 (portfolio project, low volume)
  github:
    owner: "<your-github-username>"   # or set GITHUB_OWNER in .env
    repo: care-reg-source-docs         # private repo holding the source files
    branch: main
    root_path: regulations/            # only files under here are considered
  allowed_extensions: [.pdf, .html, .htm, .txt, .md, .xml]
  max_file_size_mb: 50

http:
  timeout_seconds: 30
  max_retries: 5
  backoff_base_seconds: 1
  max_rate_limit_wait_seconds: 900     # wait up to 15 min for a rate limit reset, then fail

chunking:
  # BC Laws XML: one chunk per section, long sections split at subsection boundaries (ADR-009)
  target_tokens: 600
  max_tokens: 1200
  min_tokens: 20
  # Token counts are estimates: characters / chars_per_token. tiktoken can't download its
  # vocabulary on Databricks Free Edition, and it counts for OpenAI models, not Gemini or Claude.
  # Real billed tokens come from the model responses (gold.llm_call_log).
  chars_per_token: 4
    # Bump when the chunking or header logic changes: every chunk gets a new id, old ones are retired,
  # gold re-embeds. A deliberate, reviewed, one-line decision (ADR-009).
  chunker_version: "1"

models:
  # Embeddings: Databricks-hosted model (ADR-010). No API key, text never leaves the platform.
  # Chat models (Databricks primary, Gemini fallback) are added with the LLM gateway.
  embeddings:
    provider: databricks
    endpoint: databricks-gte-large-en
    dim: 1024
    batch_size: 8                      # 16 got HTTP 429 "workspace QPS rate limit" (tested 2026-09-27)
    min_seconds_between_calls: 1.0     # pace ourselves; 429s still retried with backoff

      # Chat models: every call goes through the LLM gateway (ADR-011).
  # route = the order models are tried in; the next one is the fallback.
  # allowed_data = which classifications (docs/02) a model may receive. Restricted: none.
  chat:
    route:
      - databricks-meta-llama-3-3-70b-instruct
      - databricks-gpt-oss-120b
      - gemini-2.5-flash
    models:
      databricks-meta-llama-3-3-70b-instruct:
        provider: databricks            # hosted in the workspace, no key, data stays on the platform
        allowed_data: [public, internal, confidential]
      databricks-gpt-oss-120b:
        provider: databricks            # reasoning model: ~2-3x the tokens, so fallback only
        allowed_data: [public, internal, confidential]
      gemini-2.5-flash:
        provider: gemini                # external API, key in secret scope care-reg / gemini-api-key
        api_key_secret: GEMINI_API_KEY
        allowed_data: [public]          # free tier may use prompts to improve Google's models:
                                        # public text only (eval runs), never user questions
    temperature: 0                      # same question, same answer: needed for evals and audit
    max_tokens: 800
    timeout_seconds: 60
    max_retries: 1                      # one quick retry, then fall back (a user is waiting)
    daily_token_budget: 200000          # over this, the gateway refuses to call
    
    # Answer pipeline (ADR-012): how questions are answered from the law sections.
rag:
  prompt_version: answer-v1          # file config/prompts/answer-v1.md; a new version = a new file
  top_k: 5                           # sections given to the model per question
  candidates: 20                     # taken from each search (meaning, keyword) before merging
  rrf_k: 60                          # merge constant for reciprocal rank fusion (standard value)
  min_vector_score: 0.55             # best meaning match below this = off-topic: "not found", no model call
                                     # (measured 2026Select-String -Path config\settings.yaml -Pattern "^rag:"-09-27: off-topic 0.505, real questions 0.72 to 0.80)
  max_context_chars: 16000           # cap on law text sent per question (about 4,000 tokens)
  laws:                              # names people use in questions, per source_id
    bc_ccala_2002: [community care and assisted living act, ccala, the act]
    bc_reg_96_2009: [residential care regulation, 96/2009]
    bc_reg_189_2019: [assisted living regulation, 189/2019]

graph:
  entity_types: [Regulation, Section, Requirement, HomeType, CareService, Role, Penalty, Authority]
  relationship_types: [CONTAINS, REQUIRES, APPLIES_TO, REFERENCES, ENFORCED_BY, PENALIZED_BY, RESPONSIBLE_FOR]
  extraction_prompt_version: extract-v1

cost_guardrails:
  monthly_budget_usd: 20
  max_cost_per_run_usd: 3
  alert_at_percent: [50, 80, 100]

# USD per 1M tokens, used for gold.llm_call_log.cost_usd.
# 0 = what we pay today (Databricks Free Edition, Gemini free tier). Before a paid rollout,
# fill in the list prices from each provider's pricing page, in a reviewed PR.
pricing:
  databricks-meta-llama-3-3-70b-instruct: {input_per_1m: 0.0, output_per_1m: 0.0}
  databricks-gpt-oss-120b: {input_per_1m: 0.0, output_per_1m: 0.0}
  gemini-2.5-flash: {input_per_1m: 0.0, output_per_1m: 0.0}
