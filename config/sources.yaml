# Approved source register. A file can only be ingested if its source_id is here
# with status: approved. Adding a source is a Governance Council decision
# (docs/00_governance_charter.md section 6).
#
# Two connectors, two provinces (ADR-005, ADR-006):
#
#   connector: bclaws   British Columbia. Pulled from the public BC Laws API
#                       by document_id. No key needed.
#   connector: github   Ontario. Ontario has no public legislation API, so the
#                       files sit in a private GitHub repo and are pulled
#                       through the GitHub REST API by repo_path.
#
# Files from a source that is not approved are never downloaded.
#
# url = where the document originally comes from (for citation and licensing).
# bronze.raw_documents.source_url = the exact document (BC) or commit + path (ON) we loaded.

sources:

