    publisher: Government of Ontario (e-Laws)
    url: https://www.ontario.ca/laws/statute/10r11
    doc_type: act
    jurisdiction: "ON"   # quoted: bare ON is a boolean in YAML
    classification: Public
    license_note: Ontario e-Laws terms of use apply. Verify before any redistribution.
    redistribute_raw: false
    status: approved
    approved_by: Governance Council
    approved_on: 2026-09-24

