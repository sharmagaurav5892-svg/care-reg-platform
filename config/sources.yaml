# Approved source register. A file can only be ingested if its source_id is here
# with status: approved. Adding a source is a Governance Council decision
# (docs/00_governance_charter.md section 6).
#
# How files get here: each source's files are kept in the private GitHub repo
# set in settings.yaml (ingestion.github), under its repo_path. The GitHub
# connector maps every file to a source by that folder. Files from a source
# that is not approved are never downloaded.
#
# url = where the document originally comes from (for citation and licensing).
# bronze.raw_documents.source_url = the exact GitHub commit + path we loaded.

sources:

