# Jobs. Each task installs our wheel on serverless compute and calls an entry point.
# The flags tell the code it's on Databricks and which catalog to use (src/careplatform/runtime.py).

resources:
  jobs:
    bronze_ingest:
      name: care-reg bronze ingest (${bundle.target})
      description: Publish catalog metadata to Unity Catalog, register BC Laws batches from the landing volume into bronze, then build silver (sections, chunks, cross references).

      tasks:
        - task_key: publish_catalog
          environment_key: careplatform
          python_wheel_task:
            package_name: careplatform
            entry_point: careplatform-publish-catalog
            parameters: [--mode, databricks, --catalog, "${var.catalog}",
                         --config-dir, "${workspace.file_path}/config",
                         --git-commit, "${bundle.git.commit}"]

        - task_key: register_bclaws
          depends_on:
            - task_key: publish_catalog
          environment_key: careplatform
          python_wheel_task:
            package_name: careplatform
            entry_point: careplatform-register
            parameters: [--connector, bclaws,
                         --mode, databricks, --catalog, "${var.catalog}",
                         --config-dir, "${workspace.file_path}/config",
                         --git-commit, "${bundle.git.commit}"]
          # Ontario (github connector) is added as a parallel task once its
          # secret scope is set up. See docs/runbooks/deploy_databricks.md.

          
        - task_key: silver_bclaws
          depends_on:
            - task_key: register_bclaws
          environment_key: careplatform
          python_wheel_task:
            package_name: careplatform
            entry_point: careplatform-silver
            parameters: [--connector, bclaws,
                         --mode, databricks, --catalog, "${var.catalog}",
                         --config-dir, "${workspace.file_path}/config",
                         --git-commit, "${bundle.git.commit}"]


                         
        - task_key: gold_embeddings
          depends_on:
            - task_key: silver_bclaws
          environment_key: careplatform
          python_wheel_task:
            package_name: careplatform
            entry_point: careplatform-embed
            parameters: [--mode, databricks, --catalog, "${var.catalog}",
                         --config-dir, "${workspace.file_path}/config",
                         --git-commit, "${bundle.git.commit}"]

      environments:
        - environment_key: careplatform
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"     # 06:00 every day
        timezone_id: America/Toronto
        pause_status: PAUSED                        # prod target switches this on

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1   # two loads at once could both move the same watermark
      tags:
        project: care-reg-platform
        layer: bronze

        
    gateway_smoke:
      name: care-reg gateway smoke test (${bundle.target})
      description: Asks every configured chat model one fixed public question through the LLM gateway and logs the calls to gold.llm_call_log. Run by hand after a model or prompt change.

      tasks:
        - task_key: smoke
          environment_key: careplatform
          max_retries: 1             # a compute start blip only; model failures show in the output
          min_retry_interval_millis: 60000
          timeout_seconds: 600
          python_wheel_task:
            package_name: careplatform
            entry_point: careplatform-gateway-smoke
            parameters: [--mode, databricks, --catalog, "${var.catalog}",
                         --config-dir, "${workspace.file_path}/config",
                         --git-commit, "${bundle.git.commit}"]

      environments:
        - environment_key: careplatform
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      timeout_seconds: 1200
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1
      tags:
        project: care-reg-platform
        layer: ai
        trigger: manual              # on demand only, never scheduled (tests/test_bundle.py)
